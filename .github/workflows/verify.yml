name: Verify application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell engine and catalog tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Optimaxer.Tests.ps1

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Rust
        run: rustup default stable
      - name: Desktop tests
        working-directory: desktop
        run: cargo test --locked
      - name: Desktop lint
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Desktop release build
        working-directory: desktop
        run: cargo build --release --locked

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Installer syntax
        run: bash -n linux/install.sh
      - name: Linux tests (simulated Arch and Fedora systems)
        working-directory: linux
        run: cargo test --locked
      - name: Linux lint
        working-directory: linux
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Linux release build
        working-directory: linux
        run: cargo build --release --locked
