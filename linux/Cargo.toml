[package]
name = "optimaxer"
version = "2.15.40"
edition = "2024"
description = "Optimaxer for Manjaro/Arch and Fedora: tweaks with undo, app installer, cleaner, services, startup, debloat, DNS and tools"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
